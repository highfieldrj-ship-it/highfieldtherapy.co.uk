
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <style>
  /* Hide the invisible checkbox */
  #menu-toggle { display: none; }
  
  /* Hide the menu links by default */
  .nav-links { display: none; list-style-type: none; padding: 0; margin: 0; background-color: #f9f9f9; }
  
  /* Show the links ONLY when the hamburger is clicked */
  #menu-toggle:checked + .nav-links { display: block; }
  
  /* Make the 3 lines look like a clickable button */
  .hamburger { font-size: 28px; cursor: pointer; display: block; padding: 15px; background: #eaeaea; }
  
  /* Make the links look nice */
  .nav-links li a { display: block; padding: 15px; text-decoration: none; color: #333; border-bottom: 1px solid #ddd; }
  .nav-links li a:hover { background-color: #ddd; }
</style>

<nav>
  <label for="menu-toggle" class="hamburger">&#9776; Menu</label>
  <input type="checkbox" id="menu-toggle">
  
  <ul class="nav-links">
    <li><a href="#about">About Me</a></li>
    <li><a href="#therapy">Types of Therapy</a></li>
    <li><a href="#fees">Fees & Booking</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>
    <div class="Frame"
    >
        <h1 id="Title"></h1>
        <h5 id="Email"></h5>
        <p id="Paragraph">
        </p>
            <h5 id="Second_Title">
        
            </h5>
            <div>
                <button
                id="submitBtn">Contact Us</button>
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
